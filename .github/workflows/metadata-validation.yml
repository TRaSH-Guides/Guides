# Validate: Metadata - validates metadata.json against metadata.schema.json.
# Triggers: push to master or pull requests touching metadata.json/schema, or manual dispatch.
name: "Validate: Metadata"
run-name: "${{ github.workflow }} · ${{ github.event_name }}"

on:
  push:
    branches: [master]
    paths:
      - metadata.json
      - metadata.schema.json
      - .github/workflows/metadata-validation.yml
  pull_request:
    paths:
      - metadata.json
      - metadata.schema.json
      - .github/workflows/metadata-validation.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Validate metadata.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: pip install -r .github/requirements-ci.txt
      - run: jsonschema -i metadata.json metadata.schema.json
