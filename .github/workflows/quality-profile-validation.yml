# Validate: Quality Profiles - validates radarr/sonarr quality-profile and cf-group JSON files.
# Triggers: push to master or pull requests touching quality-profile/cf-group JSON files, or manual dispatch.
name: "Validate: Quality Profiles"
run-name: "${{ github.workflow }} · ${{ github.event_name }}"

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/quality-profile-validation.yml
      - docs/json/radarr/cf/*.json
      - docs/json/radarr/quality-profiles/**
      - docs/json/radarr/quality-profile-groups/**
      - docs/json/radarr/cf-groups/**
      - docs/json/sonarr/cf/*.json
      - docs/json/sonarr/quality-profiles/**
      - docs/json/sonarr/quality-profile-groups/**
      - docs/json/sonarr/cf-groups/**
      - scripts/validate-quality-profiles.py
  pull_request:
    paths:
      - .github/workflows/quality-profile-validation.yml
      - docs/json/radarr/cf/*.json
      - docs/json/radarr/quality-profiles/**
      - docs/json/radarr/quality-profile-groups/**
      - docs/json/radarr/cf-groups/**
      - docs/json/sonarr/cf/*.json
      - docs/json/sonarr/quality-profiles/**
      - docs/json/sonarr/quality-profile-groups/**
      - docs/json/sonarr/cf-groups/**
      - scripts/validate-quality-profiles.py
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-quality-profiles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Validate quality profiles
        run: python scripts/validate-quality-profiles.py
