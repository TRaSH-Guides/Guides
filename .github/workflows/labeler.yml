# Label: Pull Requests - applies path-based labels to pull requests via actions/labeler.
# Triggers: pull_request_target (default event types).
name: "Label: Pull Requests"
run-name: "${{ github.workflow }} · ${{ github.event_name }}"

on:
  pull_request_target:

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          sync-labels: true
