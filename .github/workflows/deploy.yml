# Deploy: Docs (production) - builds the mkdocs site and publishes it to Cloudflare Pages production.
# Triggers: push to master.
name: "Deploy: Docs (production)"
run-name: "${{ github.workflow }} · ${{ github.event_name }}"

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'images/**'
      - 'includes/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'docs/requirements.txt'

permissions:
  contents: read

jobs:
  build:
    name: Deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            docs
            images
            includes
            overrides

      # Only trusted pushes to master trigger this workflow; fork PRs cannot poison the cache.
      - name: Setup python # zizmor: ignore[cache-poisoning]
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      # Built at deploy time instead of committed, so no PAT is needed to push to master.
      # Pulled into docs/index.md via the CONTRIBUTORS.md snippet.
      - name: Generate contributors
        env:
          GH_TOKEN: ${{ github.token }}
        # A failed or empty API response skips the section rather than blocking the deploy.
        run: |
          if ! entries=$(gh api "repos/${GITHUB_REPOSITORY}/contributors?per_page=100" --paginate --jq '
              .[]
              | select(.type == "User")
              | select(.login | ascii_downcase | IN("actions-user", "mynameisbogdan", "imgbotapp") | not)
              | "<a href=\"\(.html_url)\" target=\"_blank\" rel=\"noopener noreferrer\"><img src=\"\(.avatar_url)&s=100\" alt=\"\(.login)\" loading=\"lazy\"><b>\(.login)</b></a>"') \
              || [ -z "$entries" ]; then
            echo "::warning::Contributors API failed or returned nothing, skipping contributors section"
            exit 0
          fi
          printf '## Contributors\n\n<div class="contributors" markdown="0">\n%s\n</div>\n' "$entries" > CONTRIBUTORS.md
          echo "Contributors: $(grep -c '^<a ' CONTRIBUTORS.md)"

      - name: Build mkdocs
        run: |
          mkdocs build --clean
          mkdocs --version

      - name: Publish to Cloudflare Pages
        if: github.event_name == 'push' && contains(fromJson('["refs/heads/master", "refs/heads/main"]'), github.ref) && github.event.repository.fork == false
        id: cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >
            pages deploy site
            --project-name=trash-guides
            --branch=${{ github.ref_name }}
            --commit-hash=${{ github.sha }}
